[project]
name = "metahub-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162.4",
  "httpx>=0.28.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "respx>=0.23.1"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["D100", "D101", "D102", "D103", "E4", "E7", "E9", "F", "E501"]
ignore = ["F401"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
# -- Python version (match your ruff target-version) --
python_version = "3.14"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
